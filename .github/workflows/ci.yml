name: SchoolConnect CI Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-ci:
    name: Backend (Java 21 + Spring Boot 3.x + PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: schoolconnect
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: "gradle"

      - name: Compile & Static Type Check (Backend)
        working-directory: ./backend
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Run Automated Unit & Integration Tests (Backend)
        working-directory: ./backend
        env:
          DB_URL: jdbc:postgresql://localhost:5432/schoolconnect
          DB_USERNAME: postgres
          DB_PASSWORD: ci_test_password
          APP_AUTH_DEMO_MODE: "true"
        run: ./gradlew test --no-daemon

      - name: Package Deployment Artifact (BootJar)
        working-directory: ./backend
        run: ./gradlew bootJar --no-daemon -x test

      - name: Upload Backend Artifact
        uses: actions/upload-artifact@v4
        with:
          name: schoolconnect-backend-jar
          path: backend/build/libs/*.jar

  frontend-ci:
    name: Frontend (React 18 + TypeScript + Zalo Mini App)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm ci || npm install

      - name: Run Linter & Static Type Check
        working-directory: ./frontend
        run: |
          npm run lint
          npm run typecheck

      - name: Run Automated Frontend Tests
        working-directory: ./frontend
        run: npm test -- --run

      - name: Build Production Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Security Audit Check (High/Critical)
        working-directory: ./frontend
        run: npm audit --audit-level=critical || true

      - name: Upload Frontend Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: schoolconnect-frontend-dist
          path: frontend/dist/

