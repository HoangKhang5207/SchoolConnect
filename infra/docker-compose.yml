name: schoolconnect

services:
  postgres:
    image: postgres:16-alpine
    container_name: schoolconnect-postgres
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      POSTGRES_DB: ${DB_NAME:-schoolconnect}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-your_password_here}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - schoolconnect_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d ${DB_NAME:-schoolconnect}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - schoolconnect-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: schoolconnect-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-schoolconnect}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-your_password_here}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_WITH_AT_LEAST_32_CHARS_RANDOM_SECRET_KEY_FOR_HS256}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_AUTH_DEMO_MODE: ${APP_AUTH_DEMO_MODE:-true}
      ZALO_APP_ID: ${ZALO_APP_ID:-}
      ZALO_APP_SECRET: ${ZALO_APP_SECRET:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://h5.zdn.vn,http://localhost:3000,http://localhost:5173}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${SERVER_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
    networks:
      - schoolconnect-net

volumes:
  schoolconnect_pgdata:

networks:
  schoolconnect-net:
    driver: bridge

