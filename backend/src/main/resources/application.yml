server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: schoolconnect-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/schoolconnect}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Ho_Chi_Minh
        format_sql: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql
      continue-on-error: false
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    serialization:
      write-dates-as-timestamps: false
  config:
    import: optional:file:../.env[.properties]

app:
  timezone: Asia/Ho_Chi_Minh
  security:
    jwt-secret: ${JWT_SECRET:SchoolConnectDevDefaultSecretKeyMustBeAtLeast32BytesLong2026!}
    jwt-expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  auth:
    demo-mode: ${APP_AUTH_DEMO_MODE:true}
    zalo-app-id: ${ZALO_APP_ID:}
    zalo-app-secret: ${ZALO_APP_SECRET:}
    zalo-graph-url: ${ZALO_GRAPH_API_URL:https://graph.zalo.me/v2.0/me}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:https://h5.zdn.vn,http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.schoolconnect: INFO
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} [%thread] %-5level %logger{36} - %msg%n"

